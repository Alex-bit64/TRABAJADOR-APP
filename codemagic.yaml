workflows:
  ios-test-build:
    name: iOS Release Sin Firma
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods
    scripts:
      - name: Verificar entorno de compilacion
        script: flutter doctor -v

      - name: Instalar dependencias Flutter
        script: flutter pub upgrade

      - name: Analizar codigo Dart
        script: dart analyze lib test

      - name: Ejecutar pruebas
        script: flutter test

      - name: Actualizar e instalar CocoaPods
        script: |
          cd ios
          pod install --repo-update

      - name: Compilar iOS sin firma
        script: flutter build ios --release --no-codesign

      - name: Empaquetar IPA sin firma
        script: |
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -qry Runner-unsigned.ipa Payload

    artifacts:
      - build/ios/ipa/Runner-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
