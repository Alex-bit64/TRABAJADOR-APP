workflows:
  ios-test-build:
    name: iOS Test Build Sin Firma
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: 3.41.9
      xcode: latest
      cocoapods: default
    scripts:
      - name: Verificar Flutter
        script: flutter doctor

      - name: Instalar dependencias Flutter
        script: flutter pub get --enforce-lockfile

      - name: Analizar codigo
        script: flutter analyze

      - name: Ejecutar pruebas
        script: flutter test

      - name: Instalar CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Compilar iOS sin firma
        script: flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log
